<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>스픽 복습</title>
<meta name="theme-color" content="#E8590C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="스픽 복습">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="seg" id="modeSeg" role="tablist" aria-label="연습 방식">
      <button data-mode="speak" role="tab">말하기</button>
      <button data-mode="type" role="tab">타이핑</button>
    </div>
    <button class="icon-btn" id="openManage" aria-label="문장 관리">⚙</button>
  </header>

  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div class="chips" id="chips"></div>

  <div class="progress">
    <div class="bar"><div class="fill" id="barFill"></div></div>
    <div class="prow">
      <span id="progText"></span>
      <span class="opts">
        <label class="toggle"><input type="checkbox" id="shuffle"> 섞기</label>
        <select id="roundLen" aria-label="한 바퀴 문장 수">
          <option value="10">10개</option>
          <option value="20">20개</option>
          <option value="50">50개</option>
          <option value="0">전체</option>
        </select>
      </span>
    </div>
  </div>

  <main id="card" class="card"></main>

  <footer class="foot" id="foot"></footer>
</div>

<section id="manage" class="manage" hidden>
  <div class="mhead">
    <h2>문장 관리</h2>
    <button class="icon-btn" id="closeManage" aria-label="닫기">✕</button>
  </div>

  <div class="msec">
    <div class="row">
      <input type="search" id="search" placeholder="문장 검색" autocomplete="off">
      <button id="addBtn" class="btn">추가</button>
    </div>
    <div id="editor"></div>
    <div id="results" class="results"></div>
  </div>

  <div class="msec">
    <h3>CSV 불러오기</h3>
    <label class="btn file">CSV 파일 고르기<input type="file" id="csvFile" accept=".csv,text/csv" hidden></label>
    <div id="csvMsg" class="msg"></div>
  </div>

  <div class="msec">
    <h3>기록 옮기기·백업</h3>
    <div class="row wrap">
      <button id="exportBtn" class="btn">기록 내보내기</button>
      <label class="btn file">기록 불러오기<input type="file" id="jsonFile" accept=".json,application/json" hidden></label>
    </div>
    <div id="backupMsg" class="msg"></div>
  </div>

  <div class="msec">
    <h3>순서</h3>
    <button id="resetQueues" class="btn">모든 탭 처음부터</button>
    <div id="queueMsg" class="msg"></div>
  </div>
</section>

<script src="data.js"></script>
<script src="grade.js"></script>
<script src="logic.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
